<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us — The Digital Elites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html {
      background: #FFFFFF;
      color: #1A1A1A;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #FFFFFF;
      color: #1A1A1A;
      font-family: "Inter Tight", sans-serif;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0;
    }
    img { max-width: 100%; display: block; }
    a { color: #1A1A1A; }
    a:focus-visible {
      outline: 2px solid #1A1A1A;
      outline-offset: 3px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 40px;
      background: #FFFFFF;
      border-bottom: 1px solid #E6E6E6;
    }
    .logo { display: flex; align-items: center; flex: 0 0 auto; }
    .logo img { height: 48px; width: auto; display: block; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .nav a {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: #1A1A1A;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
    }
    .header-phone {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.4;
      color: #1A1A1A;
      text-decoration: none;
    }
    .header-phone:hover { text-decoration: underline; text-underline-offset: 4px; }

    .main {
      width: min(680px, calc(100% - 48px));
      margin: 0 auto;
      padding: 80px 0 96px;
    }
    h1 {
      margin: 0;
      font-size: 46px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #1A1A1A;
    }
    .lede {
      margin: 16px 0 0;
      max-width: 36em;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: #1A1A1A;
    }
    .rows {
      margin: 40px 0 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid #E6E6E6;
    }
    .row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 20px 0;
      border-bottom: 1px solid #E6E6E6;
    }
    .icon {
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      margin-top: 2px;
      color: #1A1A1A;
    }
    .icon svg { display: block; width: 22px; height: 22px; }
    .label {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: #3D3D3D;
    }
    .value {
      margin: 2px 0 0;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: #1A1A1A;
      overflow-wrap: break-word;
    }
    .value a {
      color: #1A1A1A;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .call {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 36px;
      padding: 12px 22px;
      background: #04EA86;
      color: #111111;
      border: 1px solid #04EA86;
      border-radius: 4px;
      font-family: "Inter Tight", sans-serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0;
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .call:hover,
    .call:focus-visible {
      background: #000000;
      color: #04EA86;
      border-color: #000000;
    }

    @media (max-width: 700px) {
      .site-header {
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 16px 20px;
      }
      .logo img { height: 40px; }
      .header-actions {
        flex: 1 1 auto;
        justify-content: flex-end;
        gap: 20px;
      }
      .main {
        width: min(680px, calc(100% - 40px));
        padding: 48px 0 72px;
      }
      h1 { font-size: 40px; }
      .call {
        width: 100%;
        min-height: 52px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="https://thedigitalelites.com/">
      <img id="logo" crossorigin="anonymous" src="https://thedigitalelites.com/wp-content/uploads/2025/06/white-logo.png" alt="The Digital Elites" width="1600" height="540">
    </a>
    <div class="header-actions">
      <nav class="nav" aria-label="Primary">
        <a href="#contact" aria-current="page">Contact</a>
      </nav>
      <a class="header-phone" href="tel:+17134878445">(713) 487-8445</a>
    </div>
  </header>

  <main class="main" id="contact">
    <h1>Contact us</h1>
    <p class="lede">Call, email, or write.</p>

    <ul class="rows">
      <li class="row">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </span>
        <div>
          <p class="label">Phone</p>
          <p class="value"><a href="tel:+17134878445">(713) 487-8445</a></p>
        </div>
      </li>
      <li class="row">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
        </span>
        <div>
          <p class="label">Email</p>
          <p class="value"><a href="mailto:hi@thedigitalelites.com">hi@thedigitalelites.com</a></p>
        </div>
      </li>
      <li class="row">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/>
            <circle cx="12" cy="10" r="2.25"/>
          </svg>
        </span>
        <div>
          <p class="label">Address</p>
          <p class="value">3323 Upland Spring Trce, Katy, Texas 77493</p>
        </div>
      </li>
    </ul>

    <a class="call" href="tel:+17134878445">Call (713) 487-8445</a>
  </main>

  <script>
    (function () {
      function paint(img) {
        if (!img || img.dataset.done || !img.naturalWidth) return;
        var canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        var frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var d = frame.data;
        for (var i = 0; i < d.length; i += 4) {
          if (d[i] > 210 && d[i + 1] > 210 && d[i + 2] > 210 && d[i + 3] > 20) {
            d[i] = 0x43; d[i + 1] = 0x3f; d[i + 2] = 0x34;
          }
        }
        ctx.putImageData(frame, 0, 0);
        img.dataset.done = "1";
        img.src = canvas.toDataURL("image/png");
      }
      var img = document.getElementById("logo");
      if (img) {
        if (img.complete && img.naturalWidth) paint(img);
        else img.addEventListener("load", function () { paint(img); });
      }
    })();
  </script>
</body>
</html>
